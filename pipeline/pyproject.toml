[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "torquay-aoi-pipeline"
version = "0.1.0"
description = "Offline Torquay AOI, EA terrain, and OSM building GIS pipeline"
requires-python = ">=3.12"
dependencies = [
  "matplotlib==3.11.2",
  "numpy==2.5.4",
  "osmium==4.3.1",
  "pyproj==3.8.0",
  "rasterio==1.5.2",
  "shapely==2.2.0",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "ruff==0.17.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
